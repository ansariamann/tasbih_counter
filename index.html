<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="description" content="A beautiful digital tasbih counter for dhikr and remembrance of Allah"><meta name="google-site-verification" content="rgXVf4O8u9sAsTNSap4rdD7Zxe2UTRM5TmgI-IY1p6w"><title>Tasbih Counter</title><link rel="icon" href="public/app-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell d-flex flex-column align-items-center justify-content-center"><button id="settings-button" class="settings-button" aria-label="Open settings">☰</button><section class="counter-layout d-flex flex-column align-items-center gap-4 gap-md-5 text-center"><h1 class="tasbih-title gold-text mb-0">Tasbih</h1><button id="counter" class="counter-glass position-relative d-flex align-items-center justify-content-center" aria-label="Increment count"><svg class="progress-ring position-absolute" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" class="progress-track"></circle><circle id="progress" cx="50" cy="50" r="46" class="progress-value"></circle></svg><span class="d-flex flex-column align-items-center position-relative"><span id="count" class="count-value">0</span><span class="target-label">of <span id="target">100</span> <span id="multiplier-label" class="gold-text d-none"></span></span></span></button><div class="d-flex align-items-center gap-3"><button id="decrement" class="control-button" aria-label="Decrement count">−</button><button id="reset" class="control-button control-reset" aria-label="Reset count">↻</button></div><div><p class="total-label mb-1">TOTAL DHIKR</p><p id="total" class="total-value mb-0">0</p></div></section></main><div id="settings-backdrop" class="settings-backdrop" hidden></div><aside id="settings-panel" class="settings-panel" aria-label="Settings" aria-hidden="true"><div class="d-flex align-items-center justify-content-between mb-5"><h2 class="settings-heading mb-0">Settings</h2><button id="close-settings" class="close-button" aria-label="Close settings">×</button></div><section class="settings-group"><h3><span>◎</span> Target count</h3><div id="target-options" class="d-flex flex-wrap gap-2"></div><div id="custom-target-row" class="custom-row" hidden><input id="custom-target" type="number" min="1" placeholder="Enter target"><button id="set-target">Set</button></div></section><hr><section class="settings-group"><h3><span>#</span> Count per click</h3><div id="multiplier-options" class="d-flex flex-wrap gap-2"></div><div id="custom-multiplier-row" class="custom-row" hidden><input id="custom-multiplier" type="number" min="1" placeholder="Enter value"><button id="set-multiplier">Set</button></div></section><hr><section class="settings-group toggle-row"><span>🔊 Sound</span><button id="sound-toggle" class="toggle"><i></i></button></section><section class="settings-group toggle-row"><span>⌁ Vibration</span><button id="vibration-toggle" class="toggle"><i></i></button></section><hr><section class="settings-group"><button id="credits-toggle" class="credits-button">ⓘ Credits</button><p id="credits" class="credits" hidden>Made by <a href="https://linkedin.com/in/-aman-ansari" target="_blank" rel="noopener noreferrer">Aman Ansari</a></p></section></aside><div id="completion" class="completion" hidden><div class="completion-glow"></div><div class="completion-ring ring-one"></div><div class="completion-ring ring-two"></div><div class="completion-copy"><p>سُبْحَانَ اللَّه</p><small>Tap anywhere to continue</small></div></div><script src="app.js"></script></body></html>
